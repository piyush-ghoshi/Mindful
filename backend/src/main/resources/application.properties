# ── Server ────────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── Database ──────────────────────────────────────────────────────────────────
# All values MUST come from environment variables. See backend/.env.example
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/mindful}
spring.datasource.username=${DATABASE_USERNAME:mindful_user}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
# validate: Hibernate checks schema matches entities — fails fast on mismatch
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.open-in-view=false

# ── Connection Pool ────────────────────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ── Flyway ────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.out-of-order=false
spring.flyway.validate-on-migrate=true
spring.flyway.schemas=public

# ── JWT ───────────────────────────────────────────────────────────────────────
# MUST be set via JWT_SECRET env var — at least 256 bits (32+ chars)
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ── CORS ──────────────────────────────────────────────────────────────────────
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174}

# ── Mail (disabled for dev) ───────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=noreply@mindfulwellness.com
app.mail.enabled=false
app.notification.max-retries=3

# ── Groq AI (MindBot) ─────────────────────────────────────────────────────────
# MUST be set via GROQ_API_KEY env var
groq.api.key=${GROQ_API_KEY:}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.model=llama-3.1-8b-instant
groq.api.max-tokens=1024

# ── Rate Limiting ─────────────────────────────────────────────────────────────
rate-limit.auth.requests-per-minute=${RATE_LIMIT_AUTH_PER_MIN:5}
rate-limit.api.requests-per-minute=${RATE_LIMIT_API_PER_MIN:100}
rate-limit.chat.daily-limit=${RATE_LIMIT_CHAT_DAILY:50}
rate-limit.report.daily-limit=${RATE_LIMIT_REPORT_DAILY:5}

# ── Firebase ──────────────────────────────────────────────────────────────────
# Credentials loaded from FIREBASE_CREDENTIALS_JSON env var or FIREBASE_CREDENTIALS_PATH file path
# See FirebaseConfig.java for the full loading chain
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.mindful=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.flywaydb=INFO
logging.level.org.flywaydb.core.internal.database.base.Database=ERROR
logging.level.org.springframework.web.servlet=DEBUG

# ── Application ───────────────────────────────────────────────────────────────
spring.application.name=mindful-wellness-platform

# ── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health
